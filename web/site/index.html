<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- 入口 HTML 不允许被缓存：它引用了带 hash 的 JS，一旦这份 HTML 停留在旧版本，
         用户就会一直看到上一版界面（这正是「同一网址不同人不同样」的根因）。
         下面的 meta 对老浏览器/部分网关有效，现代浏览器由版本自检脚本兜底。 -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <!-- 本次构建的唯一版本号，由 vite.config.ts 在构建时替换 -->
    <meta name="build-id" content="20261112160024-qypc" />
    <script>
      /* 版本自检：与服务器上的 version.json 比对，发现自己是旧 HTML 就带 ?v= 重载一次。
         正常情况（版本一致）不产生任何请求副作用；离线或接口异常时静默跳过。 */
      (function () {
        try {
          if (location.protocol === "file:") return;
          var meta = document.querySelector('meta[name="build-id"]');
          var mine = meta && meta.getAttribute("content");
          if (!mine || mine.indexOf("__BUILD") === 0) return;
          function grab(url) {
            // 分享链接靠 ?sharecode= 通过网关鉴权，探测请求也必须带上，否则拿到的是
            // 「链接不完整」的 HTML 页面而不是版本清单。
            var q = "?t=" + Date.now();
            var sc = location.search.match(/[?&]sharecode=([^&]+)/);
            if (sc) q += "&sharecode=" + sc[1];
            return fetch(url + q, { cache: "no-store" })
              .then(function (r) {
                var ct = (r.headers.get("content-type") || "").toLowerCase();
                return r.ok && ct.indexOf("json") >= 0 ? r.json() : null;
              })
              .catch(function () {
                return null;
              });
          }
          // 根路径与当前路径各试一次：站点挂在子目录、或路由处于两层深链接时都能命中
          grab("./version.json")
            .then(function (j) {
              return j ? j : grab("/version.json");
            })
            .then(function (j) {
              if (!j || !j.build || j.build === mine) return;
              var KEY = "ag-build-reloaded";
              var done = null;
              try {
                done = sessionStorage.getItem(KEY);
              } catch (e) {}
              // 已经为这个版本重载过：说明 CDN 把 HTML 钉死了，停止重试，避免死循环
              if (done === j.build) return;
              try {
                sessionStorage.setItem(KEY, j.build);
              } catch (e) {}
              // 用 URL 对象改写，保留 sharecode 等既有参数，只追加 v；丢掉 sharecode
              // 会被网关判成「链接不完整」，队友点进来直接看不到页面。
              var u = new URL(location.href);
              u.searchParams.set("v", j.build);
              location.replace(u.pathname + u.search + u.hash);
            })
            .catch(function () {});
        } catch (e) {}
      })();
    </script>
    <title>学业护航 · 学业预警智能体</title>
    <meta
      name="description"
      content="面向学生、辅导员、教务、家长、任课教师五端的学业预警智能体：用过程数据提前看见风险，每个预警分数都可追溯到具体原因，并给出可执行的补救方案。"
    />
    <meta property="og:title" content="学业护航 · 学业预警智能体" />
    <meta
      property="og:description"
      content="把「期末数挂科」变成「期中看见风险」：多因素风险模型 + 一校一规校规库 + 可解释预警与干预闭环。"
    />
    <meta property="og:type" content="website" />
    <!-- 首屏骨架：Vue 挂载前就画出结构，避免「白屏一闪」。
         mount 时 Vue 会清空 #app 内容，这段骨架自动被替换掉，不需要额外卸载逻辑。 -->
    <style>
      html,
      body {
        margin: 0;
        background: #faf5ee;
      }      .boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #faf5ee;
        color: #3b2e24;
        font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      }
      .boot-ring {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        border: 3px solid #eadfcd;
        border-top-color: #c2410c;
        animation: boot-spin 0.85s linear infinite;
      }
      .boot-title {
        font-size: 17px;
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      .boot-sub {
        font-size: 13px;
        color: #8e7a66;
        margin-top: -10px;
      }
      .boot-track {
        width: 168px;
        height: 3px;
        border-radius: 2px;
        background: #eadfcd;
        overflow: hidden;
        margin-top: 4px;
      }
      .boot-bar {
        width: 40%;
        height: 100%;
        border-radius: 2px;
        background: #c2410c;
        animation: boot-slide 1.25s ease-in-out infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes boot-slide {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(360%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-ring,
        .boot-bar {
          animation: none;
        }
        .boot-bar {
          width: 100%;
        }
      }
      /* 首屏开屏幕：直接打开某个端时，Vue 挂载到开屏动画起播之间有几百毫秒，
         以前这段时间端口原样露在屏幕上（就是"闪一下"）。这块幕在 HTML 里、
         和样式同一批解析，第一帧就盖住；开屏动画接手时立刻撤掉。 */
      #boot-veil {
        display: none;
      }
      html.v11-veil #boot-veil {
        display: block;
        position: fixed;
        inset: 0;
        z-index: 10001;
        background:
          radial-gradient(72% 58% at 74% 16%, #1d6a5b 0%, rgba(29, 106, 91, 0) 62%),
          linear-gradient(158deg, #1a6154 0%, #16564a 46%, #0e3d35 100%);
      }
    </style>
    <!-- 以前：直接打开某个端、本地又有登录态 → 第一帧就挂绿幕，防止端口页面先露一下。
         现在每次打开都先落在登录页（见 router 里的 bootNav），首帧不再是端口页面，
         这块幕布反而会在跳转前闪一下绿色，所以撤掉。#boot-veil 的样式留着：
         应用内跳转时的预备幕仍由 App.vue 接管（它用的是同一块 DOM）。 -->
    <script type="module" crossorigin src="./assets/index-lmxmaEUY.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/vue-BPrFmZ2n.js">
    <link rel="modulepreload" crossorigin href="./assets/vendor-Dv46NwSo.js">
    <link rel="modulepreload" crossorigin href="./assets/element-C-svEG1v.js">
    <link rel="stylesheet" crossorigin href="./assets/element-D-kf9ZMK.css">
    <link rel="stylesheet" crossorigin href="./assets/index-BtpLo26z.css">
  </head>
  <body>
    <div id="boot-veil" aria-hidden="true"></div>
    <div id="app">
      <div class="boot" role="status" aria-live="polite">
        <div class="boot-ring" aria-hidden="true"></div>
        <div class="boot-title">学业护航</div>
        <div class="boot-sub">正在载入学情数据…</div>
        <div class="boot-track" aria-hidden="true"><div class="boot-bar"></div></div>
      </div>
    </div>
    <noscript>
      <div style="max-width: 560px; margin: 12vh auto; padding: 24px; background: #fff; border: 1px solid #eadfcd; border-radius: 12px; color: #3b2e24; font-family: -apple-system, 'Microsoft YaHei', sans-serif">
        <h1 style="font-size: 18px; margin: 0 0 10px">需要启用 JavaScript</h1>
        <p style="margin: 0; color: #5d4b3a; line-height: 1.7">本系统是单页应用，所有视图由前端渲染。请在浏览器设置中允许本页运行脚本后刷新。</p>
      </div>
    </noscript>
    <!-- 兜底提示：直接双击 index.html 时资源路径会被当成 file:///C:/assets/... 全部 404，
         页面会白屏且控制台一堆 NOT FOUND。这里提前说明正确打开方式。 -->
    <script>
      if (location.protocol === "file:") {
        document.documentElement.innerHTML =
          '<head><meta charset="utf-8"><title>请通过本地服务打开</title></head>' +
          '<body style="margin:0;font:16px/1.7 -apple-system,BlinkMacSystemFont,\'Segoe UI\',sans-serif;background:#faf5ee;color:#3b2e24">' +
          '<div style="max-width:640px;margin:12vh auto;background:#fff;border:1px solid #eadfcd;border-radius:12px;padding:32px">' +
          '<h1 style="font-size:20px;margin:0 0 12px">这个页面不能直接双击打开</h1>' +
          '<p style="margin:0 0 16px;color:#5d4b3a">你看到的是 <code>file://</code> 地址，浏览器会把 <code>/assets/…</code> 当成 ' +
          "<code>file:///C:/assets/…</code>，脚本和样式全部加载不到，所以页面是空白的。</p>" +
          '<p style="margin:0 0 8px"><b>方式一：看线上版（最省事）</b></p>' +
          '<p style="margin:0 0 20px"><a href="https://academic-guardian-19259.app.workbuddy.host/?sharecode=MIIDH5PSIP" ' +
          'style="color:#1d4ed8">https://academic-guardian-19259.app.workbuddy.host/?sharecode=MIIDH5PSIP</a><br>' +
          '<span style="color:#6b7280;font-size:14px">整串复制，末尾的 ?sharecode=… 不能省略</span></p>' +
          '<p style="margin:0 0 8px"><b>方式二：本机跑起来</b></p>' +
          '<pre style="background:#0f172a;color:#e2e8f0;padding:14px 16px;border-radius:8px;overflow:auto;font-size:13px">' +
          "cd academic-guardian\npython -m venv .venv\n.venv\\Scripts\\activate\n" +
          "pip install -r requirements.txt\npython -m uvicorn app:app --port 8600</pre>" +
          '<p style="margin:12px 0 0;color:#5d4b3a">然后浏览器打开 <code>http://127.0.0.1:8600</code></p>' +
          "</div></body>";
      }
    </script>
  </body>
</html>
